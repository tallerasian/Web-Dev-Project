<!DOCTYPE html>
<html>
    <head> 
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/create_event.css">
        <title>Synced - Create Event</title>
    </head>
    <body>
        <a class="back">Back</a>
        <form>
            <h1>Create Event</h1>

            <!-- show progress -->
            <div class="progress">
                <ol>
                    <li class="node">Details</li>
                    <li class="node">Availability</li>
                    <li class="node">Invite</li>
                </ol>
            </div>

            <!-- steps -->
             <div class="steps">
                <fieldset class="step">
                    <!-- radio option determines which event type tab is visible -->
                    <div id="event-type">
                        <input type="radio" name="event-type" value="day-event" id="day-event">
                        <label for="day-event">Specific Day</label>
                        <input type="radio" name="event-type" value="weekly-event" id="weekly-event">
                        <label for="weekly-event">Weekly</label>
                    </div>

                    <div class="event-type-tab" id="day-event-tab">
                        Dummy text1
                    </div>

                    <div class="event-type-tab" id="weekly-event-tab">
                        Dummy text2a
                    </div>
                </fieldset>

                <fieldset class="step">
                    <h3>Step 2</h3>
                    <p>Dummy content</p>
                </fieldset>

                <fieldset class="step">
                    <h3>Step 3</h3>
                    <p>Dummy content</p>
                </fieldset>
             </div>

            <!-- navigational buttons -->
            <div class="navigation">
                <button type="button" id="prev">Previous</button>
                <button type="button" id="next">Next</button>
                <button type="submit" id="submit">Submit</button>
            </div>
        </form>
        <!-- script placed at the end, when DOM is fully loaded -->
        <script src="javascript/create_event.js"></script>
    </body>
</html>
