<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heatmap – Days</title>
  <link rel="stylesheet" href="css/heatmap.css">
</head>
<body>

  <div class="header">
    <h1 class="header-title">Create Event</h1>
    <div class="steps">
      <div class="step">
        <div class="step-circle">✓</div>
        <span class="step-label">Details</span>
      </div>
      <div class="step-line done"></div>
      <div class="step">
        <div class="step-circle">✓</div>
        <span class="step-label">Availability</span>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <div class="step-circle pending">3</div>
        <span class="step-label">Invite</span>
      </div>
    </div>
    <div class="event-label">📅 My Event</div>
  </div>

  <div class="content">
    <div class="calendar-card">
      <div id="calendar"></div>
    </div>
  </div>

  <script src="javascript/heatmap_days.js"></script>
</body>
</html>
