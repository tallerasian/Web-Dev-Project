<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synced – Home</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="home-page">

<svg width="0" height="0" style="position:absolute">
    <defs>
        <symbol id="synced-logo" viewBox="0 0 100 100">
            <path d="M 30 20 Q 18 20 18 36 Q 18 52 50 52 Q 82 52 82 65 Q 82 80 70 80"
                  fill="none" stroke="#E07800" stroke-width="10" stroke-linecap="round"/>
            <circle cx="30" cy="20" r="7" fill="#E07800"/>
            <circle cx="70" cy="80" r="7" fill="#E07800"/>
            <circle cx="50" cy="52" r="5" fill="#C06010"/>
        </symbol>
    </defs>
</svg>

<div class="home-page-wrap">

    <!-- TOPBAR -->
    <div class="home-topbar">
        <div class="home-logo-row">
            <svg width="32" height="32" class="logo-svg" viewBox="0 0 100 100"><use href="#synced-logo"/></svg>
            <span class="home-wordmark">Synced</span>
        </div>
        <button class="icon-btn" title="Settings">⚙️</button>
    </div>

    <!-- NAV TABS -->
    <div class="home-nav-tabs">
        <button class="nav-tab active" onclick="switchTab(this, 'tab-events')">My Events</button>
        <button class="nav-tab" onclick="switchTab(this, 'tab-calendar')">My Calendar</button>
        <button class="nav-tab" onclick="switchTab(this, 'tab-join')">Join Event</button>
    </div>

    <!-- CONTENT -->
    <div class="home-content">

        <!-- MY EVENTS TAB -->
        <div id="tab-events" class="tab-content active">
            <div class="events-panel">
                <div class="panel-title">Upcoming Events</div>
                <div class="event-card">
                    <div>
                        <div class="event-card-name">Team Lunch</div>
                        <div class="event-card-sub">Days of Week · 3 respondents · Best: Tue 11:00am</div>
                    </div>
                    <span class="event-card-badge">OPEN</span>
                </div>
                <div class="event-card">
                    <div>
                        <div class="event-card-name">Game Night</div>
                        <div class="event-card-sub">Specific Days · 2 respondents · Waiting...</div>
                    </div>
                    <span class="event-card-badge pending">PENDING</span>
                </div>
            </div>
        </div>

        <!-- MY CALENDAR TAB -->
        <div id="tab-calendar" class="tab-content">
            <div class="mini-calendar">
                <div class="cal-nav">
                    <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
                    <span class="cal-month" id="cal-month-label"></span>
                    <button class="cal-nav-btn" onclick="calNav(1)">›</button>
                </div>
                <div class="cal-grid" id="cal-grid"></div>
            </div>
        </div>

        <!-- JOIN EVENT TAB -->
        <div id="tab-join" class="tab-content">
            <div class="events-panel">
                <div class="panel-title">Join an Event</div>
                <p class="join-instructions">Enter the 6-character code shared by your event organiser.</p>
                <input id="join-code-input" class="input-field join-code-field" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false" />
                <div class="join-feedback" id="join-feedback"></div>
                <button class="btn-primary" onclick="submitJoinCode()">Join Event</button>
            </div>
        </div>

    </div>

    <!-- BOTTOM ACTIONS -->
    <div class="bottom-actions">
        <button class="btn-primary">Create New Event +</button>
    </div>

</div>
<script src="../static/javascript/home.js"></script>

</body>
</html>
