<!doctype html>
<html>
  <head>
    <title>Login Page</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page">
    <div class="container">
      <img src="Assets/Logo.png" alt="Logo" class="logo" />

      <form id="loginForm">
        <input
          type="text"
          id="username"
          placeholder="Username:"
          class="input-box"
        />
        <input
          type="password"
          id="password"
          placeholder="Password:"
          class="input-box"
        />

        <div class="button-line">
          <button type="button" id="registerBtn" class="text-button">
            Register
          </button>
          <button type="submit" class="text-button">Sign in</button>
        </div>

        <div class="join-line">
          <button type="button" id="joinBtn" class="join-button">
            Have a code? Join an event →
          </button>
        </div>

        <p id="message"></p>
      </form>
    </div>

    <script src="javascript/login.js"></script>
  </body>
</html>
